run:
  timeout: 5m
  tests: true
  exclude-dirs:
    - volumes
    - bin
    - tmp
    - docs

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - gocritic
    - gocyclo
    - dupl
    - gosec
  disable:
    - exhaustruct
    - varnamelen
    - wrapcheck
    - depguard

linters-settings:
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - gocyclo
    - path: docs/
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
